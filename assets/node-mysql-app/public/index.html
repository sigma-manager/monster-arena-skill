<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notatki — Node.js + MySQL (MonsterASP.NET)</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  #status { padding: .5rem .75rem; border-radius: .5rem; font-size: .85rem; margin-bottom: 1rem; }
  #status.ok   { background: #dafbe1; color: #0a5c2e; }
  #status.warn { background: #fff3cd; color: #7a5b00; }
  #status.err  { background: #ffe1e1; color: #8a1f1f; }
  form { display: flex; gap: .5rem; margin-bottom: 1rem; }
  input[type=text] { flex: 1; padding: .5rem .75rem; border: 1px solid #999555; border-radius: .5rem; font: inherit; }
  button { padding: .5rem .9rem; border: 0; border-radius: .5rem; background: #2563eb; color: #fff; cursor: pointer; font: inherit; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: .5rem; padding: .5rem .25rem; border-bottom: 1px solid #999333; }
  li .name { flex: 1; overflow-wrap: anywhere; }
  li.done .name { text-decoration: line-through; opacity: .55; }
  li button.del { background: transparent; color: #c00; padding: .25rem .5rem; }
  small.meta { opacity: .6; font-weight: normal; }
</style>
</head>
<body>
  <h1>📝 Notatki <small class="meta">— Node.js + MySQL na MonsterASP.NET</small></h1>
  <div id="status">Łączenie z /api/health…</div>

  <form id="add-form">
    <input id="name" type="text" maxlength="200" placeholder="Nowa notatka…" required autocomplete="off">
    <button type="submit">Dodaj</button>
  </form>

  <ul id="items"></ul>

  <p><small class="meta">API: GET/POST /api/items · PUT/DELETE /api/items/:id · GET /api/health</small></p>
  <script src="/app.js"></script>
</body>
</html>
